<!DOCTYPE html>
<html lang="es">

<head>
    <title>Validador de archivos</title>
    <meta charset="utf-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="js/ejercicio02.js"></script>

    <style>
        /* Ocultar input file */
        #archivo {
            display: none;
        }

        /* Estilo del botón falso */
        .custom-file-label {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container ">
        <div class="m-4 d-flex h-100 w-100 justify-content-center aling-items-center">
            <div class="col-auto bg-light p-5">

                <form action="javascript:void(0)" name="frmdatos" id="dataform">

                    <h2>Validador de archivos</h2>

                    <div class="input-group p-2">
                        <label for="archivo" class="btn btn-secondary custom-file-label">
                            Seleccionar archivo
                        </label>

                        <input type="file" name="txtdato" id="archivo" />
                    </div>

                    <input class="w-100 btn btn-primary" type="button" name="btnvalidar" id="validar" value="Validar" />

                </form>

            </div>
        </div>
    </div>
</body>

</html>
